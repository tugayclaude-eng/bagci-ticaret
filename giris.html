<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap - Bağcı Ticaret</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Animasyonlu Arka Plan -->
  <div class="bg-animation"></div>

  <!-- Üst Bar -->
  <div class="ust-bar">
    <div class="ust-bar-sol">
      <span>🚀 Ücretsiz kargo fırsatları!</span>
    </div>
    <div class="ust-bar-sag">
      <a href="#"><i class="fas fa-phone"></i> 0534 661 2200</a>
      <a href="#"><i class="fas fa-map-marker-alt"></i> Bursa Kayapa</a>
    </div>
  </div>

  <!-- Navigation -->
  <header>
    <nav>
      <div class="logo">BAĞCI TİCARET</div>
      <ul class="nav-links">
        <li><a href="index.html"><i class="fas fa-home"></i> Ana Sayfa</a></li>
        <li><a href="urunler.html"><i class="fas fa-th"></i> Ürünler</a></li>
        <li><a href="sepet.html" class="sepet-btn"><i class="fas fa-shopping-cart"></i> Sepet (<span id="sepet-sayisi">0</span>)</a></li>
        <li><a href="giris.html"><i class="fas fa-user"></i> Giriş Yap</a></li>
      </ul>
    </nav>
  </header>

  <!-- Giriş Formu -->
  <main>
    <div class="giris-container">
      <h2><i class="fas fa-user-circle"></i> Giriş Yap</h2>
      <form id="giris-formu">
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> E-posta</label>
          <input type="email" id="email" name="email" placeholder="ornek@email.com" required>
        </div>
        <div class="form-group">
          <label for="sifre"><i class="fas fa-lock"></i> Şifre</label>
          <input type="password" id="sifre" name="sifre" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn" style="width:100%;">
          <i class="fas fa-sign-in-alt"></i> Giriş Yap
        </button>
      </form>
      <p style="text-align:center; margin-top:1.5rem;">
        Hesabınız yok mu? <a href="kayit.html" style="color: var(--primary);">Kayıt Ol</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-bottom">
      <p>&copy; 2026 Mağazam. Tüm hakları saklıdır.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('giris-formu').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const sifre = document.getElementById('sifre').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: sifre
      });

      if (error) {
        alert('Giriş hatası: ' + error.message);
      } else {
        alert('Giriş başarılı!');
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>

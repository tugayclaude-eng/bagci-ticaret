<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ödeme - Bağcı Ticaret</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Animasyonlu Arka Plan -->
  <div class="bg-animation"></div>

  <!-- Üst Bar -->
  <div class="ust-bar">
    <div class="ust-bar-sol">
      <span>🚀 Ücretsiz kargo fırsatları!</span>
    </div>
    <div class="ust-bar-sag">
      <a href="#"><i class="fas fa-phone"></i> 0534 661 2200</a>
      <a href="#"><i class="fas fa-map-marker-alt"></i> Bursa Kayapa</a>
    </div>
  </div>

  <!-- Navigation -->
  <header>
    <nav>
      <div class="logo">BAĞCI TİCARET</div>
      <ul class="nav-links">
        <li><a href="index.html"><i class="fas fa-home"></i> Ana Sayfa</a></li>
        <li><a href="urunler.html"><i class="fas fa-th"></i> Ürünler</a></li>
        <li><a href="sepet.html" class="sepet-btn"><i class="fas fa-shopping-cart"></i> Sepet (<span id="sepet-sayisi">0</span>)</a></li>
        <li><a href="giris.html"><i class="fas fa-user"></i> Giriş Yap</a></li>
      </ul>
    </nav>
  </header>

  <!-- Ödeme -->
  <main>
    <div class="sepet-container">
      <h2 class="sepet-baslik scroll-animate"><i class="fas fa-credit-card"></i> Ödeme</h2>
      
      <div id="siparis-ozeti" style="background: linear-gradient(145deg, #1e1e32, #151528); padding: 2rem; border-radius: 20px; margin-bottom: 2rem; border: 1px solid var(--border);">
        <h3 style="margin-bottom: 1.5rem;"><i class="fas fa-receipt"></i> Sipariş Özeti</h3>
        <div id="ozet-listesi"></div>
        <div class="sepet-toplam" id="odeme-toplam">Toplam: 0 ₺</div>
      </div>

      <form id="odeme-formu" style="background: linear-gradient(145deg, #1e1e32, #151528); padding: 2rem; border-radius: 20px; border: 1px solid var(--border);">
        <h3 style="margin-bottom: 1.5rem;"><i class="fas fa-truck"></i> Teslimat Bilgileri</h3>
        <div class="form-group">
          <label for="ad-soyad"><i class="fas fa-user"></i> Ad Soyad</label>
          <input type="text" id="ad-soyad" name="ad-soyad" placeholder="Adınız Soyadınız" required>
        </div>
        <div class="form-group">
          <label for="telefon"><i class="fas fa-phone"></i> Telefon</label>
          <input type="tel" id="telefon" name="telefon" placeholder="05XX XXX XX XX" required>
        </div>
        <div class="form-group">
          <label for="adres"><i class="fas fa-map-marker-alt"></i> Adres</label>
          <textarea id="adres" name="adres" placeholder="Açık adresiniz" required></textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
          <div class="form-group">
            <label for="sehir"><i class="fas fa-city"></i> Şehir</label>
            <input type="text" id="sehir" name="sehir" placeholder="İstanbul" required>
          </div>
          <div class="form-group">
            <label for="postakodu"><i class="fas fa-mail-bulk"></i> Posta Kodu</label>
            <input type="text" id="postakodu" name="postakodu" placeholder="34000" required>
          </div>
        </div>
        
        <h3 style="margin: 2rem 0 1.5rem;"><i class="fas fa-credit-card"></i> Kart Bilgileri</h3>
        <div class="form-group">
          <label for="kart-numara">Kart Numarası</label>
          <input type="text" id="kart-numara" name="kart-numara" placeholder="1234 5678 9012 3456" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
          <div class="form-group">
            <label for="son-kullanma">Son Kullanma Tarihi</label>
            <input type="text" id="son-kullanma" name="son-kullanma" placeholder="AA/YY" required>
          </div>
          <div class="form-group">
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" placeholder="123" required>
          </div>
        </div>
        
        <button type="submit" class="btn" style="width:100%; margin-top: 2rem;">
          <i class="fas fa-lock"></i> Güvenli Ödeme Yap
        </button>
        
        <p style="text-align: center; margin-top: 1.5rem; font-size: 13px; color: var(--text-light);">
          <i class="fas fa-shield-alt"></i> 256-bit SSL şifreleme ile güvenli ödeme
        </p>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-bottom">
      <p>&copy; 2026 Mağazam. Tüm hakları saklıdır.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script>
    function siparisOzetiniGoster() {
      const ozetListesi = document.getElementById('ozet-listesi');
      const toplamEl = document.getElementById('odeme-toplam');
      
      if (sepet.length === 0) {
        window.location.href = 'sepet.html';
        return;
      }

      ozetListesi.innerHTML = sepet.map(item => `
        <div style="display:flex; justify-content:space-between; padding:1rem 0; border-bottom:1px solid var(--border);">
          <span>${item.ad} x${item.adet}</span>
          <span style="font-weight:600; color:var(--primary);">${(item.fiyat * item.adet).toFixed(2)} ₺</span>
        </div>
      `).join('');

      const toplam = sepet.reduce((sum, item) => sum + (item.fiyat * item.adet), 0);
      toplamEl.textContent = `Toplam: ${toplam.toFixed(2)} ₺`;
    }

    document.getElementById('odeme-formu').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const { data: { user } } = await supabaseClient.auth.getUser();
      
      if (!user) {
        alert('Ödeme yapmak için giriş yapmalısınız!');
        window.location.href = 'giris.html';
        return;
      }

      const toplam = sepet.reduce((sum, item) => sum + (item.fiyat * item.adet), 0);
      
      const { error: siparisHatasi } = await supabaseClient
        .from('siparisler')
        .insert({
          kullanici_id: user.id,
          toplam: toplam,
          adres: document.getElementById('adres').value,
          durum: 'hazirlaniyor'
        });

      if (siparisHatasi) {
        alert('Sipariş kaydedilirken hata oluştu: ' + siparisHatasi.message);
        return;
      }

      sepet = [];
      sepetiKaydet();
      
      alert('Siparişiniz alındı! Teşekkürler.');
      window.location.href = 'index.html';
    });

    siparisOzetiniGoster();
  </script>
</body>
</html>

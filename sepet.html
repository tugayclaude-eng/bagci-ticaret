<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sepetim - Bağcı Ticaret</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Animasyonlu Arka Plan -->
  <div class="bg-animation"></div>

  <!-- Üst Bar -->
  <div class="ust-bar">
    <div class="ust-bar-sol">
      <span>🚀 Ücretsiz kargo fırsatları!</span>
    </div>
    <div class="ust-bar-sag">
      <a href="#"><i class="fas fa-phone"></i> 0534 661 2200</a>
      <a href="#"><i class="fas fa-map-marker-alt"></i> Bursa Kayapa</a>
    </div>
  </div>

  <!-- Navigation -->
  <header>
    <nav>
      <div class="logo">BAĞCI TİCARET</div>
      <ul class="nav-links">
        <li><a href="index.html"><i class="fas fa-home"></i> Ana Sayfa</a></li>
        <li><a href="urunler.html"><i class="fas fa-th"></i> Ürünler</a></li>
        <li><a href="sepet.html" class="sepet-btn"><i class="fas fa-shopping-cart"></i> Sepet (<span id="sepet-sayisi">0</span>)</a></li>
        <li><a href="giris.html"><i class="fas fa-user"></i> Giriş Yap</a></li>
      </ul>
    </nav>
  </header>

  <!-- Sepet -->
  <main>
    <div class="sepet-container">
      <h2 class="sepet-baslik scroll-animate"><i class="fas fa-shopping-cart"></i> Alışveriş Sepetim</h2>
      <div id="sepet-listesi"></div>
      <div class="sepet-toplam" id="sepet-toplam">Toplam: 0 ₺</div>
      <button class="btn" style="width:100%; margin-top:1.5rem;" onclick="odemeSayfasinaGit()">
        <i class="fas fa-credit-card"></i> Ödemeye Geç
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-bottom">
      <p>&copy; 2026 Mağazam. Tüm hakları saklıdır.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script>
    function odemeSayfasinaGit() {
      if (sepet.length === 0) {
        alert('Sepetiniz boş!');
        return;
      }
      window.location.href = 'odeme.html';
    }
  </script>
</body>
</html>
